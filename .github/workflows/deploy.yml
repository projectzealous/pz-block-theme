name: Deploy WordPress Theme

on:
  push:
    branches:
      - studymind

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check FTP settings
        env:
          STUDYMIND_FTP_HOST: ${{ secrets.STUDYMIND_FTP_HOST }}
          STUDYMIND_FTP_USERNAME: ${{ secrets.STUDYMIND_FTP_USERNAME }}
          STUDYMIND_FTP_PASSWORD: ${{ secrets.STUDYMIND_FTP_PASSWORD }}
          STUDYMIND_FTP_DIR: ${{ vars.STUDYMIND_FTP_DIR || secrets.STUDYMIND_FTP_DIR }}
        run: |
          missing=0
          for v in STUDYMIND_FTP_HOST STUDYMIND_FTP_USERNAME STUDYMIND_FTP_PASSWORD; do
            if [ -n "${!v}" ]; then
              echo "  $v: set"
            else
              echo "::error title=Check FTP settings::Secret $v is missing or empty"
              missing=1
            fi
          done
          if [ -n "$STUDYMIND_FTP_DIR" ]; then
            echo "  STUDYMIND_FTP_DIR: $STUDYMIND_FTP_DIR"
          else
            echo "::error title=Check FTP settings::Variable STUDYMIND_FTP_DIR is missing or empty"
            missing=1
          fi
          exit $missing

      - name: Deploy theme
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.STUDYMIND_FTP_HOST }}
          username: ${{ secrets.STUDYMIND_FTP_USERNAME }}
          password: ${{ secrets.STUDYMIND_FTP_PASSWORD }}
          protocol: ftps
          server-dir: ${{ vars.STUDYMIND_FTP_DIR || secrets.STUDYMIND_FTP_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            **/node_modules/**
            tests/**

      - name: Done
        run: echo "WordPress theme deployment completed!"
