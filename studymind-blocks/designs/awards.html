<section class="awards" id="enquire" data-lay="awards">
  <div class="wrap awards-grid">
    <div>
      <p class="eyebrow" data-edit="">Awards</p>
      <h2 data-edit="">Recognised for <span>excellence in EdTech</span></h2>
      <p class="lede" data-edit="">Independently rated, government backed and voted for by the students and parents we work with.</p>
      <div class="awardgrid">
        <div class="award"><div class="ph light" data-asset="/assets/brand/official-uk-govt.png"></div><b data-edit="">Official UK Government Partner</b></div>
        <div class="award"><div class="ph light" data-asset="/assets/brand/trustpilot.png"></div><b data-edit="">Best Online Tuition 2024</b></div>
        <div class="award"><div class="ph light" data-asset="/assets/brand/trustpilot.png"></div><b data-edit="">Top 5 Educational Institutions</b></div>
      </div>
    </div>

    <form class="form-card" onsubmit="return false">
      <h3 data-edit="">Book a commitment-free call to see how we can help today</h3>
      <div class="field"><label data-edit="">Who are you?</label>
        <select><option>Parent</option><option>Student</option><option>School</option><option>Local authority</option></select></div>
      <div class="field"><label data-edit="">Your full name</label><input placeholder="e.g. Kunal Dasani" style=""></div>
      <div class="field"><label data-edit="">Mobile number</label>
        <div class="phone"><select><option>UK +44</option><option>US +1</option><option>IE +353</option></select><input placeholder="Mobile number" style=""></div></div>
      <div class="field"><label data-edit="">Your email address</label><input placeholder="e.g. hello@studymind.co.uk" style=""></div>
      <button class="btn btn-primary" data-edit="">Book a free consultation</button>
    </form>
  </div>
</section>
